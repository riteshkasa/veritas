<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Niwas</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 260px; margin: 0; padding: 12px; background: #14141a; color: #f5f5f7; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      p { font-size: 12px; opacity: 0.8; margin: 0 0 10px; }
      .row { display: flex; gap: 6px; }
      button { flex: 1; background: #3b82f6; color: white; border: 0; border-radius: 6px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
      button.secondary { background: #334155; }
      .hint { margin-top: 10px; font-size: 11px; opacity: 0.6; line-height: 1.4; }
      code { background: rgba(255,255,255,0.08); padding: 1px 4px; border-radius: 3px; }
    </style>
  </head>
  <body>
    <h1>Niwas Fact Checker</h1>
    <p>Open a YouTube video, then press Start. The overlay appears on the video page.</p>
    <div class="row">
      <button id="start">Start</button>
      <button id="stop" class="secondary">Stop</button>
    </div>
    <div class="hint">
      Backend expected at <code>localhost:8787</code>. Edit
      <code>extension/lib/config.js</code> to change.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
