<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Niwas</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        width: 280px;
        padding: 18px;
        background: #2b2b30;
        color: #e4e4e8;
      }
      h1 {
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
        margin-bottom: 6px;
      }
      p {
        font-size: 12px;
        color: rgba(228, 228, 232, 0.6);
        line-height: 1.5;
        margin-bottom: 14px;
      }
      .row { display: flex; gap: 8px; }
      button {
        flex: 1;
        background: #e4e4e8;
        color: #1c1c1f;
        border: 0;
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease;
      }
      button:hover { background: #fff; transform: scale(1.02); }
      button:active { transform: scale(0.97); }
      button.secondary {
        background: rgba(255, 255, 255, 0.07);
        color: rgba(228, 228, 232, 0.7);
        font-weight: 500;
      }
      button.secondary:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #e4e4e8;
      }
      .hint {
        margin-top: 14px;
        font-size: 11px;
        color: rgba(228, 228, 232, 0.4);
        line-height: 1.5;
      }
      code {
        background: rgba(255, 255, 255, 0.07);
        padding: 2px 5px;
        border-radius: 5px;
        font-size: 10.5px;
      }
    </style>
  </head>
  <body>
    <h1>Niwas Fact Checker</h1>
    <p>Open a YouTube video, then press Start. The overlay appears on the video page.</p>
    <div class="row">
      <button id="start">Start</button>
      <button id="stop" class="secondary">Stop</button>
    </div>
    <div class="hint">
      Backend expected at <code>localhost:8787</code>. Edit
      <code>extension/lib/config.js</code> to change.
    </div>
    <script src="popup.js"></script>
  </body>
</html>
